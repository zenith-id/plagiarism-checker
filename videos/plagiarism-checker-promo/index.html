<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #faf9f5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-value"
        class="scene"
        data-composition-id="02-value"
        data-composition-src="compositions/frames/02-value.html"
        data-start="8"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-stats"
        class="scene"
        data-composition-id="03-stats"
        data-composition-src="compositions/frames/03-stats.html"
        data-start="17"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-features"
        class="scene"
        data-composition-id="04-features"
        data-composition-src="compositions/frames/04-features.html"
        data-start="25"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-howitworks"
        class="scene"
        data-composition-id="05-howitworks"
        data-composition-src="compositions/frames/05-howitworks.html"
        data-start="35"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="45"
        data-duration="10"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.fromTo("#el-02-value", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8);
        tl.to("#el-02-value", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-03-stats", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.to("#el-03-stats", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-04-features", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to("#el-04-features", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.fromTo("#el-05-howitworks", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.to("#el-05-howitworks", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 45);
        tl.to({}, { duration: 55 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
