<template>
  <div id="root" data-composition-id="03-stats" data-start="0" data-duration="8.5" data-track-index="0" data-width="1920" data-height="1080">
    <div class="ground clip" data-start="0" data-duration="8" data-track-index="0"></div>

    <div class="stage">
      <div class="row" id="row">
        <div class="tile tile-hero">
          <span class="figure" id="figure">0</span>
          <span class="unit">file/batch</span>
        </div>
        <div class="tile" id="t2"><span class="figure-sm">3</span><span class="unit">algoritma</span></div>
        <div class="tile" id="t3"><span class="figure-sm">PDF</span><span class="unit">ekspor</span></div>
        <div class="tile" id="t4"><span class="figure-sm">100%</span><span class="unit">lokal</span></div>
      </div>
    </div>
  </div>

  <style>
    #root {
      container-type: size;
      width: 1920px;
      height: 1080px;
      position: relative;
      font-family: Georgia, serif;
    }
    .ground {
      position: absolute;
      inset: 0;
      background: #faf9f5;
    }
    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .row {
      display: flex;
      align-items: stretch;
      gap: 2.2cqw;
    }
    .tile {
      background: #F2E1DB;
      border: 1px solid rgba(20,20,19,0.12);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04);
      padding: 3cqw 2.4cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8cqw;
      opacity: 0;
      will-change: transform, opacity;
    }
    .tile-hero {
      background: #faf9f5;
      padding: 3cqw 3cqw;
      min-width: 26cqw;
    }
    .figure {
      font-family: Georgia, serif;
      font-size: 9.4cqw;
      line-height: 0.95;
      letter-spacing: -0.025em;
      color: #141413;
      display: inline-block;
      font-variant-numeric: tabular-nums;
      transform-origin: center center;
      will-change: transform;
    }
    .figure-sm {
      font-family: Georgia, serif;
      font-size: 4.6cqw;
      line-height: 1;
      color: #141413;
    }
    .unit {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.35cqw;
      letter-spacing: 0.04em;
      color: #141413;
      opacity: 0.78;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    if (window.gsap) {
      const tl = gsap.timeline({ paused: true });

      // Hero "200 file/batch" centered count-up (0.0–2.0s)
      const figure = document.getElementById("figure");
      const counter = { v: 0 };
      tl.to(counter, {
        v: 200,
        duration: 1.8,
        ease: "power3.out",
        onUpdate: () => { figure.textContent = Math.round(counter.v); }
      }, 0.1);
      tl.fromTo(figure, { scale: 0.5 }, { scale: 1, duration: 1.8, ease: "power3.out" }, 0.1);
      tl.fromTo(".tile-hero", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo(".tile-hero .unit", { opacity: 0 }, { opacity: 0.78, duration: 0.5 }, 0.9);

      // Three more tiles assemble into a row (2.0–5.0s), center-outward
      const extras = ["#t2", "#t3", "#t4"];
      extras.forEach((sel, i) => {
        const dir = i === 0 ? -1 : 1;
        tl.fromTo(sel,
          { opacity: 0, scale: 0.8, x: dir * 6 },
          { opacity: 1, scale: 1, x: 0, duration: 0.6, ease: "power3.out" },
          2.2 + i * 0.3);
      });

      // Hold + subtle jitter (5.0–8.0s)
      const phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * 1.2,
        duration: 3.0,
        ease: "none",
        onUpdate: () => {
          const y = Math.sin(phase.p) * 2.5;
          gsap.set("#row", { y: y });
        }
      }, 5.0);

      window.__timelines["03-stats"] = tl;
    }
  </script>
</template>
