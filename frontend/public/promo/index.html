    <!-- ===== Player runtime ===== -->
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const TOTAL = 55;
        const scenes = Array.from(document.querySelectorAll(".scene"));
        const meta = scenes.map((el) => ({
          el,
          frame: el.dataset.frame,
          start: parseFloat(el.dataset.start),
          duration: parseFloat(el.dataset.duration),
        }));

        // Clone each template into its scene, then run the frame script.
        function boot() {
          meta.forEach((m) => {
            const tpl = document.getElementById("tpl-" + m.frame);
            if (!tpl) return;
            const node = tpl.content.firstElementChild.cloneNode(true);
            m.el.appendChild(node);
            const scriptEl = node.querySelector("script");
            if (scriptEl) {
              const s = document.createElement("script");
              s.textContent = scriptEl.textContent;
              document.body.appendChild(s);
            }
          });
          // Defer playback until all frame timelines registered.
          requestAnimationFrame(() => requestAnimationFrame(play));
        }

        let rafId = null;
        function play() {
          const timelines = meta.map((m) => window.__timelines[m.frame]).filter(Boolean);
          if (timelines.length < meta.length) { requestAnimationFrame(play); return; }
          let t0 = null;
          function tick(now) {
            if (t0 === null) t0 = now;
            let t = ((now - t0) / 1000) % TOTAL;
            meta.forEach((m) => {
              const local = t - m.start;
              const visible = local >= 0 && local < m.duration;
              m.el.classList.toggle("is-active", visible);
              const tl = window.__timelines[m.frame];
              if (tl) {
                const lt = Math.max(0, Math.min(local, m.duration));
                tl.time(lt);
              }
            });
            rafId = requestAnimationFrame(tick);
          }
