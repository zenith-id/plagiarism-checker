    <!-- ===== Frame templates (inlined from compositions/frames/*.html) ===== -->
    <template id="tpl-01-hook"><div id="root" data-composition-id="01-hook" data-start="0" data-duration="8.5" data-track-index="0" data-width="1920" data-height="1080">
    <div class="ground clip" data-start="0" data-duration="8" data-track-index="0"></div>

    <div class="stage">
      <div class="kicker" id="kicker"><span class="star">✱</span> Deteksi plagiarisme tugas mahasiswa</div>
      <h1 class="h1" id="h1">
        <span class="w">Cek</span> <span class="w">kemiripan</span> <span class="w">dokumen</span>
        <span class="w">secara</span> <span class="w">massal,</span> <span class="w">cepat,</span>
        <span class="w">dan</span> <span class="w">lokal.</span>
      </h1>
    </div>

    <style>
      #root {
        container-type: size;
        width: 100%; height: 100%;
        position: relative;
        font-family: Georgia, serif;
      }
      .ground {
        position: absolute;
        inset: 0;
        background-color: #faf9f5;
        background-image: radial-gradient(60cqw 60cqw at 50% 42%, rgba(204,120,92,0.16), rgba(204,120,92,0) 70%);
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.5cqw;
        padding: 0 8cqw;
        text-align: center;
      }
      .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.46cqw;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #141413;
      }
      .kicker .star {
        color: #cc785c;
        margin-right: 0.4cqw;
      }
      .h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 4.6cqw;
        line-height: 1.16;
        letter-spacing: -0.018em;
        color: #141413;
        max-width: 78cqw;
        margin: 0;
      }
      .h1 .w {
        display: inline-block;
        will-change: transform, opacity;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      window.__frameInit = window.__frameInit || {};
      window.__frameOut = window.__frameOut || {};
      window.__frameInit["01-hook"] = function (root) {
        if (!window.gsap) return;
        const q = gsap.utils.selector(root);
        const tl = gsap.timeline({ paused: true });
        const words = q("#h1 .w");

        tl.fromTo(q("#kicker"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);

        words.forEach((el, i) => {
          tl.fromTo(el,
            { opacity: 0, y: 26, scale: 0.96 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
            0.15 + i * 0.16);
        });

        tl.fromTo(root,
          { scale: 1.02 },
          { scale: 1, duration: 4.0, ease: "power2.out" }, 0.15);

        const phase = { p: 0 };
        tl.to(phase, {
          p: Math.PI * 2 * 1.1,
          duration: 3.0,
          ease: "none",
          onUpdate: () => {
            const y = Math.sin(phase.p) * 2.5;
            words.forEach((el) => { el.style.transform = `translateY(${y}px)`; });
          }
        }, 4.5);

        window.__timelines["01-hook"] = tl;
      };
      window.__frameOut["01-hook"] = function (root) {
        if (!window.gsap) return gsap.to(root, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" });
      };
    </script>
  </div></template>

    <script>
      window.__timelines = window.__timelines || {};
      window.__frameInit = window.__frameInit || {};
      window.__frameOut = window.__frameOut || {};
      window.__frameInit["02-value"] = function (root) {
        if (!window.gsap) return;
        const q = gsap.utils.selector(root);
        const tl = gsap.timeline({ paused: true });

        const chips = ["#chip1", "#chip2", "#chip3"];
        chips.forEach((sel, i) => {
          tl.fromTo(q(sel),
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
            0.2 + i * 0.22);
        });

        tl.to(q(".ring"), { rotation: 6, duration: 3.0, ease: "power1.inOut" }, 2.5);
        tl.to(q(".ring"), { rotation: 0, duration: 3.5, ease: "power1.inOut" }, 5.5);

        tl.fromTo(q("#shield"),
          { scale: 0.4, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, 2.7);

        tl.fromTo(q("#caption"),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.4);

        const phase = { p: 0 };
        tl.to(phase, {
          p: Math.PI * 2 * 1.3,
          duration: 3.5,
          ease: "none",
          onUpdate: () => {
            const s = 1 + Math.sin(phase.p) * 0.012;
            gsap.set(q("#shield"), { scale: s });
          }
        }, 5.5);

        window.__timelines["02-value"] = tl;
      };
      window.__frameOut["02-value"] = function (root) {
        if (!window.gsap) return gsap.to(root, { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" });
      };
    </script>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        window.__frameInit = window.__frameInit || {};
        window.__frameOut = window.__frameOut || {};
        const TOTAL = 55;
        const LEAD = 0.45;
        const scenes = Array.from(document.querySelectorAll(".scene"));
        const meta = scenes.map((el) => ({
          el, frame: el.dataset.frame,
          start: parseFloat(el.dataset.start), duration: parseFloat(el.dataset.duration),
          leaving: false,
        }));
        function boot() {
          meta.forEach((m) => {
            const tpl = document.getElementById("tpl-" + m.frame);
            if (!tpl) return;
            const node = tpl.content.firstElementChild.cloneNode(true);
            m.el.appendChild(node);
            const init = window.__frameInit[m.frame];
            if (init) { try { init(node); } catch (e) { console.error("frame " + m.frame + " init failed", e); } }
          });
          requestAnimationFrame(() => requestAnimationFrame(play));
        }
        let started = false;
        function play() {
          if (started) return; started = true;
          let t0 = null;
          function tick(now) {
            if (t0 === null) t0 = now;
            let t = ((now - t0) / 1000) % TOTAL;
            meta.forEach((m) => {
              const local = t - m.start;
              const visible = local >= 0 && local < m.duration;
              m.el.classList.toggle("is-active", visible);
              if (visible && local >= m.duration - LEAD && !m.leaving) {
                m.leaving = true;
                const out = window.__frameOut[m.frame];
                if (out) { try { out(m.el.firstElementChild); } catch (e) {} }
              }
              if (local < 0 || local >= m.duration) m.leaving = false;
              const tl = window.__timelines[m.frame];
              if (tl) { const lt = Math.max(0, Math.min(local, m.duration)); tl.time(lt); }
            });
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }
        if (window.gsap) boot();
        else window.addEventListener("load", () => { if (window.gsap) boot(); });
      })();
    </script>
